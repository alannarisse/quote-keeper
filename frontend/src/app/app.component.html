<div class="app">
  <header>
    <div class="container">
      <h1>
        <wa-icon name="quote-left" style="margin-right: 8px;"></wa-icon>
        Quote Keeper
      </h1>
      <nav>

        <wa-button-group>
          <wa-button [variant]="isActive('/') ? 'brand' : 'neutral'" routerLink="/" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}" size="s">
            <wa-icon slot="prefix" name="shuffle"></wa-icon>
            Random
          </wa-button>
          <wa-button [variant]="isActive('/quotes') ? 'brand' : 'neutral'" routerLink="/quotes"
            routerLinkActive="active" size="s">
            <wa-icon slot="prefix" name="list"></wa-icon>
            All Quotes
          </wa-button>
          <wa-button [variant]="isActive('/add') ? 'brand' : 'neutral'" routerLink="/add" routerLinkActive="active"
            size="s">
            <wa-icon slot="prefix" name="plus"></wa-icon>
            Add Quote
          </wa-button>
          @if (authService.isAuthenticated()) {
            <wa-button variant="neutral" size="s" (click)="logout()" title="Logout" aria-label="Logout">
              <wa-icon slot="prefix" name="right-from-bracket"></wa-icon>
              Logout
            </wa-button>
          } @else {
            <wa-button variant="neutral" size="s" (click)="showLoginModal.set(true)" title="Login" aria-label="Login">
              <wa-icon slot="prefix" name="lock"></wa-icon>
              Login
            </wa-button>
          }
        </wa-button-group>
      </nav>
    </div>
  </header>
  <main class="container">
    <router-outlet />
  </main>
  <footer>
    <h2>Brought to you by the letters Q, and K, and the numbers, 66, 42, and 0.</h2>
  </footer>
  @if (showLoginModal()) {
    <app-password-modal (close)="showLoginModal.set(false)" (authenticated)="onAuthenticated($event)" />
  }
</div>
